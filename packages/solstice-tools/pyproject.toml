[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solstice-tools"
version = "0.1.0"
description = "Utility functions at the base of solstice"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3.2",
    "pandas>=2.3.1",
]

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.7",
]

[tool.uv.workspace]
members = [
    ".",
]
