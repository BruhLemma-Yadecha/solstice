services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: solstice-backend
    container_name: solstice_web
    command: gunicorn --workers 3 --timeout 300 --max-requests 1000 --max-requests-jitter 100 --bind 0.0.0.0:8000 solstice.wsgi:application
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "${WEB_APP_HOST_PORT_FORWARD:-8000}:${WEB_APP_CONTAINER_PORT:-8000}"
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  websocket:
    build:
      context: .
      dockerfile: Dockerfile
    image: solstice-backend
    container_name: solstice_websocket
    command: daphne -b 0.0.0.0 -p 8001 solstice.asgi:application
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "8001:8001"
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  redis:
    image: "redis:8-alpine"
    container_name: solstice_redis
    ports:
      - "${REDIS_HOST_PORT_FORWARD:-6380}:${REDIS_CONTAINER_PORT:-6379}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  db:
    image: postgres:17-alpine
    container_name: solstice_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    ports:
      - "${POSTGRES_HOST_PORT_FORWARD:-5434}:${POSTGRES_CONTAINER_PORT:-5432}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: solstice-backend
    container_name: solstice_migrate
    entrypoint: ""
    command: python manage.py migrate
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: solstice-backend
    container_name: solstice_worker
    command: celery -A solstice worker -l info --concurrency=4 --max-memory-per-child=512000
    volumes:
      - .:/app
      - media_volume:/app/media
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    name: solstice_postgres_data
  media_volume:
    name: solstice_media_volume