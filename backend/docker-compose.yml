services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn --workers 3 --bind 0.0.0.0:${WEB_APP_CONTAINER_PORT:-8000} solstice.wsgi:application
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "${WEB_APP_HOST_PORT_FORWARD:-8000}:${WEB_APP_CONTAINER_PORT:-8000}"
    env_file:
      - .env
    depends_on:
      - redis
      - db

  redis:
    image: "redis:alpine"
    ports:
      - "${REDIS_HOST_PORT_FORWARD:-6379}:${REDIS_CONTAINER_PORT:-6379}"

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A solstice worker -l info
    volumes:
      - .:/app
      - media_volume:/app/media
    env_file:
      - .env
    depends_on:
      - web
      - redis
      - db

  db:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "${POSTGRES_HOST_PORT_FORWARD:-5432}:${POSTGRES_CONTAINER_PORT:-5432}"
    env_file:
      - .env

volumes:
  postgres_data:
  media_volume:
